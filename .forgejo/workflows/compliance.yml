name: Reseller compliance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_ID: roomvox

jobs:
  matrix-test:
    name: NC ${{ matrix.nc }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nc: '32', php: '8.2' }
          - { nc: '33', php: '8.3' }

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo, intl, zip, sqlite3, xml, dom, mbstring
          tools: composer:v2

      - name: Composer install
        continue-on-error: true
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --no-interaction || true
          fi

      - name: PHPStan
        id: phpstan
        continue-on-error: true
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            ./vendor/bin/phpstan analyse --no-progress --error-format=raw > phpstan.txt 2>&1 || true
            LINES=$(wc -l < phpstan.txt || echo 0)
          else
            LINES=0
          fi
          if [ "$LINES" = "0" ]; then echo "result=pass" >> $GITHUB_OUTPUT; else echo "result=fail" >> $GITHUB_OUTPUT; fi

      - name: Psalm
        id: psalm
        continue-on-error: true
        run: |
          if [ -f psalm.xml ] || [ -f psalm.xml.dist ]; then
            ./vendor/bin/psalm --no-progress --output-format=text > psalm.txt 2>&1 || true
            LINES=$(wc -l < psalm.txt || echo 0)
          else
            LINES=0
          fi
          if [ "$LINES" = "0" ]; then echo "result=pass" >> $GITHUB_OUTPUT; else echo "result=fail" >> $GITHUB_OUTPUT; fi

      - name: PHPCS
        id: phpcs
        continue-on-error: true
        run: |
          if [ -f .phpcs.xml ] || [ -f phpcs.xml.dist ]; then
            ./vendor/bin/phpcs --report=full --no-colors > phpcs.txt 2>&1 || true
            LINES=$(wc -l < phpcs.txt || echo 0)
          else
            LINES=0
          fi
          if [ "$LINES" = "0" ]; then echo "result=pass" >> $GITHUB_OUTPUT; else echo "result=fail" >> $GITHUB_OUTPUT; fi

      - name: PHPUnit
        id: phpunit
        continue-on-error: true
        run: |
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            ./vendor/bin/phpunit --testdox > phpunit.txt 2>&1 || true
            if grep -q "OK\|tests, " phpunit.txt; then echo "result=pass" >> $GITHUB_OUTPUT; else echo "result=fail" >> $GITHUB_OUTPUT; fi
          else
            echo "result=pass" >> $GITHUB_OUTPUT
          fi

      - name: Compute status + score
        id: status
        run: |
          STATUS=passed
          [ "${{ steps.phpstan.outputs.result }}" = "fail" ] && STATUS=failed
          [ "${{ steps.psalm.outputs.result }}" = "fail" ] && STATUS=failed
          [ "${{ steps.phpcs.outputs.result }}" = "fail" ] && STATUS=failed
          [ "${{ steps.phpunit.outputs.result }}" = "fail" ] && STATUS=failed
          SCORE=100
          [ "${{ steps.phpstan.outputs.result }}" = "fail" ] && SCORE=$((SCORE-25))
          [ "${{ steps.psalm.outputs.result }}" = "fail" ] && SCORE=$((SCORE-20))
          [ "${{ steps.phpcs.outputs.result }}" = "fail" ] && SCORE=$((SCORE-15))
          [ "${{ steps.phpunit.outputs.result }}" = "fail" ] && SCORE=$((SCORE-30))
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Ingest result
        if: always()
        run: |
          REF="${GITHUB_REF_NAME:-main}"
          # Build the JSON body without heredoc + jq — just printf.
          PAYLOAD=$(printf '{"app_id":"%s","git_ref":"%s","nc_version":"%s","status":"%s","source":"gitea","checks":{"phpstan":"%s","psalm":"%s","phpcs":"%s","tests":"%s"},"quality_score":%s,"run_url":"%s/%s/actions/runs/%s"}' \
            "$APP_ID" \
            "$REF" \
            "${{ matrix.nc }}" \
            "${{ steps.status.outputs.status }}" \
            "${{ steps.phpstan.outputs.result }}" \
            "${{ steps.psalm.outputs.result }}" \
            "${{ steps.phpcs.outputs.result }}" \
            "${{ steps.phpunit.outputs.result }}" \
            "${{ steps.status.outputs.score }}" \
            "$GITEA_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID")

          echo "Posting payload to ingest:"
          echo "$PAYLOAD"

          curl -sS -X POST "${{ secrets.COMPLIANCE_INGEST_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COMPLIANCE_INGEST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w '\nhttp=%{http_code}\n'

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        # Twee afwijkingen van de GitHub-versie, allebei nodig:
        #
        # 1. Volledige URL. Forgejo zoekt een kale `owner/repo` op
        #    data.forgejo.org en setup-php staat daar niet (checkout en
        #    setup-node wél) -- anders "repository not found".
        # 2. Vastgezet op 2.33.0. De v2-tag draait inmiddels op node24 en
        #    forgejo-runner 6.4.0 kent maximaal node20; met @v2 faalt de job
        #    op "runs.using ... got node24". 2.33.0 is de laatste node20-tag.
        #
        # Bij een runner-upgrade mag dit weer @v2 worden.
        uses: https://github.com/shivammathur/setup-php@2.33.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json
          coverage: none

      - name: Install Composer dependencies
        env:
          # composer leest dit rechtstreeks uit de omgeving, zonder
          # auth.json. Dat is hier nodig omdat actions/checkout HOME per
          # stap tijdelijk verzet ("Temporarily overriding HOME=..."), zodat
          # een `composer config -g` in een eerdere stap in een andere
          # home belandt dan de install-stap leest -- het token werd dan
          # netjes gezet en vervolgens genegeerd.
          # PAT_GITHUB is een scope-loos classic token (org-secret voxcloud-apps).
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.PAT_GITHUB }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testsuite unit

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Backstop for the l10n source-string guard. The primary defence is the
  # prebuild hook on `npm run build`; this catches a commit that reaches main
  # without a local build, so new strings cannot silently miss the Transifex
  # push. Check-only: it never writes, commits or pushes.
  l10n:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pure Node, no dependencies: extract-en-json.js scans src/ and lib/ with
      # plain regexes and needs neither xgettext nor node_modules.
      - name: Check l10n source strings are in sync with the manifest
        run: node scripts/check-l10n-sync.js
